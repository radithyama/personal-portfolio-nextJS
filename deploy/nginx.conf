# Redirect plain HTTP (by domain or bare IP) to the canonical HTTPS site
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://radithyama.site$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name radithyama.site;

    ssl_certificate     /etc/letsencrypt/live/radithyama.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radithyama.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Planit redirects (radithyama.site/planit -> planit.radithyama.site), installed by the planit repo.
    # Wildcard so nginx still starts on a VM without Planit.
    include snippets/planit*.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
